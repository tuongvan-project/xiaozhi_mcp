services:
  - type: web
    name: theoly-vn-mcp
    runtime: python
    plan: free
    buildCommand: curl -fsSL https://deno.land/install.sh | sh && export PATH="$HOME/.deno/bin:$PATH" && pip install -r requirements.txt
    startCommand: export PATH="$HOME/.deno/bin:$PATH" && python app.py
    envVars:
      - key: MCP_ENDPOINT
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8
